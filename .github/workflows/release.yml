name: Release

# A maintainer pushes tag vX.Y.Z on a commit of main: the CI runs again on it (ci.yml, which builds
# and checks the release archive, and runs the tests on the files it holds), the tag is checked (its
# form, the plugin's version in package.json and constants.js, its notes in CHANGELOG.md, its
# commit on main), then, approved by a maintainer in the protected environment "release", a draft
# GitHub release of the tag gets the six site files of that archive, each as its own asset, and
# those notes with each file's place in the site and SHA-256. A maintainer publishes the draft by
# hand. There is no registry: a Wix site takes those six files (README, "Installation").
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Before the environment's approval, so that a maintainer is asked only about a valid release.
  tag:
    name: The tag
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Its form, the plugin's version, its notes, a commit of main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! echo "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::$TAG is not vX.Y.Z"
            exit 1
          fi
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::package.json has version $version, the tag is $TAG"
            exit 1
          fi
          if ! grep -qx "export const PLUGIN_VERSION = \"$version\";" \
            plugin/site/backend/sattleme-checkout/constants.js; then
            echo "::error::constants.js does not name version $version (PLUGIN_VERSION)"
            exit 1
          fi
          # Its section's heading: "## <version> - <date>", the date in ISO 8601.
          if ! grep -Eqx "## ${version//./\\.} - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section \"## $version - <date>\""
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG is not on main"
            exit 1
          fi

  release:
    name: Draft release
    needs: [ci, tag]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # Required reviewers: a maintainer approves each release. The only job that can write.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The archive the CI built and checked in this run, from this commit, where
      # scripts/archive.mjs reads it (dist/checkout-wix-<version>.zip).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checkout-wix
          path: dist
      # For scripts/archive.mjs, which imports Node's own modules only: no npm ci.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # The archive read back as scripts/archive.mjs wrote it (each file as its SHA256SUMS says,
      # nothing else), its six site files written into release/, and the notes: the CHANGELOG's
      # section of the version, then each file, where it goes in the site, and its SHA-256.
      - name: The six files of the tag's version, and the notes of that version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          ls dist
          test "$(ls dist)" = "checkout-wix-$version.zip"
          (cd dist && sha256sum "checkout-wix-$version.zip") | tee -a "$GITHUB_STEP_SUMMARY"
          node scripts/archive.mjs --extract release
          test "$(wc -l < release/SHA256SUMS)" -eq 6
          # Each file under its own name: six different names, all under backend/.
          test "$(awk '{ n = split($2, p, "/"); print p[n] }' release/SHA256SUMS | sort -u | wc -l)" -eq 6
          test "$(awk '$2 !~ /^backend\// ' release/SHA256SUMS | wc -l)" -eq 0
          awk -v heading="## $version - " 'index($0, heading) == 1 { found = 1; next } found && /^## / { exit } found { print }' \
            CHANGELOG.md > notes.md
          test -s notes.md
          {
            echo
            echo "## Files"
            echo
            echo "The six files to put into the site, each at its place in the site's backend (README, \"Installation\"). Check each one's SHA-256 before publishing the site."
            echo
            echo "| File | Where in the site | SHA-256 |"
            echo "| --- | --- | --- |"
            awk '{ n = split($2, p, "/"); printf "| `%s` | `%s` | `%s` |\n", p[n], $2, $1 }' release/SHA256SUMS
          } >> notes.md
          cat release/SHA256SUMS | tee -a "$GITHUB_STEP_SUMMARY"
      # A draft: nothing is published until a maintainer publishes it. Refused if the tag has a
      # release already, draft or not.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: ${{ github.ref_name }}
        with:
          script: |
            const fs = require("fs");
            const tag = process.env.TAG;
            const { owner, repo } = context.repo;
            // The six files, as SHA256SUMS lists them: "<sha256>  backend/<path>".
            const files = fs
              .readFileSync("release/SHA256SUMS", "utf8")
              .trimEnd()
              .split("\n")
              .map((line) => {
                const [, sha256, path] = /^([0-9a-f]{64}) {2}(backend\/\S+)$/.exec(line);
                return { sha256, path, name: path.split("/").pop() };
              });
            if (files.length !== 6 || new Set(files.map((f) => f.name)).size !== 6) {
              core.setFailed("SHA256SUMS does not list six files of six different names");
              return;
            }
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo });
            if (releases.some((release) => release.tag_name === tag)) {
              core.setFailed(`${tag} has a release already: delete it to make it again`);
              return;
            }
            const release = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: tag,
              body: fs.readFileSync("notes.md", "utf8"),
              draft: true
            });
            for (const { name, path, sha256 } of files) {
              const data = fs.readFileSync(`release/${path}`);
              const type = name.endsWith(".js") ? "text/javascript" : "application/json";
              const asset = await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.data.id,
                name,
                data,
                headers: { "content-type": type, "content-length": data.length }
              });
              // The asset as GitHub keeps it: its name, its size and its digest, those of the file.
              if (
                asset.data.name !== name ||
                asset.data.size !== data.length ||
                (asset.data.digest && asset.data.digest !== `sha256:${sha256}`)
              ) {
                core.setFailed(`${name}: GitHub kept ${asset.data.name}, ${asset.data.size} bytes, ${asset.data.digest}`);
                return;
              }
            }
            core.notice(`Draft release ${tag} made with its six files: ${release.data.html_url}`);
